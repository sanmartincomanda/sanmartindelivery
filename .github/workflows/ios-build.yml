name: Validate iOS build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build and upload a signed App Store version instead of simulator validation
        type: boolean
        default: false
      build_number:
        description: Unique App Store build number for signed releases
        type: string
        default: '1'
      screenshots:
        description: Run real iPhone and iPad guest shopping UI tests and capture screenshots
        type: boolean
        default: false
      auth_only:
        description: Test native Apple and Google presentation on iPhone (no real credentials)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app-store:
    if: inputs.release
    uses: ./.github/workflows/ios-appstore.yml
    with:
      build_number: ${{ inputs.build_number }}
      upload: true
    secrets: inherit
  build-ios:
    if: ${{ !inputs.release }}
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build iOS web assets
        run: npm run test:store-access && npm run test:apple-auth && npm run build:ios:web
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Sync Capacitor iOS project
        run: |
          npx cap sync ios
          node scripts/prepareIos.mjs
          npm run test:ios-config

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Carnes-San-Martin-iOS-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 3

      - name: Compile shopping UI tests before starting simulators
        if: inputs.screenshots || inputs.auth_only
        run: |
          gem install xcodeproj --no-document
          ruby scripts/ios/prepareScreenshotTests.rb
          xcodebuild build-for-testing -project ios/App/App.xcodeproj -scheme StoreScreenshots \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO

      - name: Smoke test native startup
        if: ${{ !inputs.screenshots && !inputs.auth_only }}
        # Fresh macOS runners can spend several minutes migrating the simulator.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            let input=""; process.stdin.on("data",c=>input+=c).on("end",()=>{
              const devices=Object.values(JSON.parse(input).devices).flat();
              const device=devices.find(d=>d.name==="iPhone 17 Pro") || devices.find(d=>d.name.startsWith("iPhone"));
              if(!device) process.exit(1); process.stdout.write(device.udid);
            });')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.sanmartinsr.app
          sleep 20
          mkdir -p build/ios/smoke
          xcrun simctl io "$DEVICE" screenshot build/ios/smoke/iphone-startup.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -F com.sanmartinsr.app
          xcrun simctl shutdown "$DEVICE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carnes-San-Martin-iOS-startup
          path: build/ios/smoke/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Capture real iPhone and iPad shopping screens
        if: inputs.screenshots || inputs.auth_only
        timeout-minutes: 30
        run: |
          set -euo pipefail
          FAILED=0
          FAMILIES="iPhone iPad"
          TEST_FILTER="-only-testing:StoreScreenshots/StoreScreenshots"
          if [ "${{ inputs.auth_only }}" = "true" ]; then
            FAMILIES="iPhone"
            TEST_FILTER="-only-testing:StoreScreenshots/StoreNativeAuthTests"
          fi
          for FAMILY in $FAMILIES; do
            DEVICE=$(xcrun simctl list devices available -j | FAMILY="$FAMILY" node -e '
              let input=""; process.stdin.on("data",c=>input+=c).on("end",()=>{
                const devices=Object.values(JSON.parse(input).devices).flat();
                const expected=process.env.FAMILY==="iPhone" ? "iPhone 17 Pro" : "iPad Pro 13-inch";
                const d=devices.find(d=>d.name===expected) || devices.find(d=>d.name.startsWith(expected)) || devices.find(d=>d.name.startsWith(process.env.FAMILY));
                if(!d)process.exit(1); process.stdout.write(d.udid);
              });')
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
            xcrun simctl uninstall "$DEVICE" com.sanmartinsr.app || true
            xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
            xcrun simctl launch "$DEVICE" com.sanmartinsr.app
            sleep 20
            mkdir -p "build/ios/screenshots/$FAMILY"
            xcrun simctl io "$DEVICE" screenshot "build/ios/screenshots/$FAMILY/00-Startup.png"
            TEST_STATUS=0
            xcodebuild test-without-building -project ios/App/App.xcodeproj -scheme StoreScreenshots \
              -destination "platform=iOS Simulator,id=$DEVICE,arch=arm64" -derivedDataPath build/ios \
              -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
              "$TEST_FILTER" \
              -resultBundlePath "build/ios/$FAMILY.xcresult" CODE_SIGNING_ALLOWED=NO \
              > "build/ios/$FAMILY-test.log" 2>&1 || TEST_STATUS=$?
            if [ -d "build/ios/$FAMILY.xcresult" ]; then
              xcrun xcresulttool export attachments --path "build/ios/$FAMILY.xcresult" --output-path "build/ios/screenshots/$FAMILY/attachments"
            fi
            xcrun simctl spawn "$DEVICE" log show --last 10m --style compact \
              --predicate 'process == "App"' > "build/ios/$FAMILY-native.log" 2>&1 || true
            xcrun simctl shutdown "$DEVICE"
            if [ "$TEST_STATUS" -ne 0 ]; then tail -100 "build/ios/$FAMILY-test.log"; FAILED=1; fi
          done
          exit "$FAILED"
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.screenshots || inputs.auth_only)
        with:
          name: Carnes-San-Martin-iOS-shopping-screens
          path: |
            build/ios/screenshots
            build/ios/*-test.log
            build/ios/*-native.log
            build/ios/*.xcresult
          if-no-files-found: ignore
          retention-days: 3
