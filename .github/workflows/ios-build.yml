name: Validate iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build iOS web assets
        run: npm run build:ios:web
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Sync Capacitor iOS project
        run: |
          npx cap sync ios
          node scripts/prepareIos.mjs
          npm run test:ios-config

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Carnes-San-Martin-iOS-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 3

      - name: Smoke test native startup
        timeout-minutes: 6
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            let input=""; process.stdin.on("data",c=>input+=c).on("end",()=>{
              const devices=Object.values(JSON.parse(input).devices).flat();
              const device=devices.find(d=>d.name==="iPhone 17 Pro Max") || devices.find(d=>d.name.startsWith("iPhone"));
              if(!device) process.exit(1); process.stdout.write(device.udid);
            });')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.sanmartinsr.app
          sleep 20
          mkdir -p build/ios/smoke
          xcrun simctl io "$DEVICE" screenshot build/ios/smoke/iphone-startup.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -F com.sanmartinsr.app
          xcrun simctl shutdown "$DEVICE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carnes-San-Martin-iOS-startup
          path: build/ios/smoke/*.png
          if-no-files-found: ignore
          retention-days: 3
